<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackXperience | Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body{
            background: linear-gradient(135deg,#dbeafe,#eef2ff,#ede9fe);
        }

        .glass{
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(15px);
        }

        .floating{
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
        }
    </style>

</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <!-- Background Blur -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-blue-300 opacity-20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-purple-300 opacity-20 rounded-full blur-3xl"></div>

    <!-- Sign Up Card -->
    <div class="glass relative w-full max-w-md rounded-3xl shadow-2xl p-8">

        <!-- AI Icon -->
        <div class="floating flex justify-center mb-6">
            <div class="w-20 h-20 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center text-4xl shadow-lg">
                🤖
            </div>
        </div>

        <h1 class="text-3xl font-bold text-center text-gray-800">
            Create Account
        </h1>

        <p class="text-center text-gray-500 mt-2 mb-8">
            Join HackXperience today.
        </p>

        <form>

            <!-- Full Name -->
            <div class="mb-5">
                <label class="block text-gray-700 mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your full name"
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label class="block text-gray-700 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="example@email.com"
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label class="block text-gray-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Create a password"
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Confirm Password -->
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    placeholder="Confirm your password"
                    class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Checkbox -->
            <div class="flex items-center mb-6">
                <input
                    type="checkbox"
                    class="mr-2">

                <span class="text-sm text-gray-600">
                    I agree to the Terms & Conditions
                </span>
            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:scale-105 transition">

                Create Account

            </button>

        </form>

        <!-- Login Link -->
        <p class="text-center text-gray-600 mt-6">
            Already have an account?

            <a
                href="login.html"
                class="text-blue-600 font-semibold hover:underline">

                Login

            </a>

        </p>

        <!-- Back -->
        <div class="text-center mt-6">
            <a
                href="index.html"
                class="text-gray-500 hover:text-blue-600">

                ← Back to Home

            </a>
        </div>

    </div>

</body>
</html>
