<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forum — TrueSelf</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f4f7fb;
        }

        .post-card {
            animation: fade 0.3s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .support-button.supported {
            background: #e0e7ff;
            color: #4338ca;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Top Left Fixed Back to Home Button with Icon -->
    <div class="fixed top-6 left-6 z-50">
        <a href="index.html" class="bg-white/90 hover:bg-white transition px-4 py-2 rounded-full text-blue-600 border border-blue-200 font-medium shadow-md flex items-center gap-2">
            🏠 Back to Home
        </a>
    </div>

    <!-- Header -->
    <header
        class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white shadow-lg pt-16 md:pt-4"
    >
        <div
            class="max-w-6xl mx-auto flex items-center justify-between p-4"
        >
            <div class="flex items-center gap-4 pl-0 md:pl-32">

                <div>
                    <h1 class="text-2xl font-bold">
                        Community Forum
                    </h1>

                    <p class="text-sm opacity-90">
                        Share what's on your mind — anonymously, or not
                    </p>
                </div>

            </div>

            <!-- New Post Button -->
            <a
                id="new-post-btn"
                href="post.html"
                class="bg-white text-indigo-600 font-semibold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition"
            >
                + New Post
            </a>
        </div>
    </header>

    <!-- Forum -->
    <main class="flex-1 overflow-y-auto p-6">

        <div class="max-w-3xl mx-auto">

            <!-- Forum reminder -->
            <div
                class="bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-6"
            >
                <p class="text-blue-800 text-sm">
                    This is a supportive community. Please respond with
                    kindness and avoid sharing personal contact information.
                </p>
            </div>

            <!-- Login Reminder Banner (Hidden if logged in) -->
            <div id="login-banner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 text-amber-800 text-sm flex justify-between items-center">
                <span>🔒 You are viewing in guest mode. Please <a href="login.html" class="font-bold underline">log in</a> to interact with posts.</span>
            </div>

            <!-- Posts will appear here -->
            <div
                id="post-list"
                class="space-y-5"
            >
                <p class="text-gray-500 text-center">
                    Loading posts...
                </p>
            </div>

        </div>

    </main>

    <script>
        const storageKey = "forumPosts";

        /*
            Check if the user is logged in. 
            Change 'isLoggedIn' to match whatever key/logic your login system uses.
        */
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

        // Show login banner if not logged in
        if (!isLoggedIn) {
            document.getElementById('login-banner').classList.remove('hidden');
            
            // Disable the "+ New Post" header button
            const newPostBtn = document.getElementById('new-post-btn');
            newPostBtn.href = "login.html";
            newPostBtn.innerText = "Login to Post";
        }

        const samplePosts = [
            {
                id: 1,
                author: "calmcloud21",
                anonymous: false,
                category: "School",
                title: "Feeling overwhelmed by assignments",
                content:
                    "I have several assignments due next week, but I keep freezing instead of starting. What helps you begin when everything feels overwhelming?",
                time: "35 minutes ago",
                supports: 12,
                comments: 3,
                sensitive: false
            },
            {
                id: 2,
                author: "Anonymous",
                anonymous: true,
                category: "Loneliness",
                title: "Feeling alone even when I am around people",
                content:
                    "I have friends around me, but I still feel disconnected sometimes. I am not looking for solutions right now. I mainly wanted somewhere safe to say it.",
                time: "2 hours ago",
                supports: 24,
                comments: 6,
                sensitive: false
            },
            {
                id: 3,
                author: "studybean",
                anonymous: false,
                category: "Motivation",
                title: "A small achievement today",
                content:
                    "I finally cleaned my room after putting it off for several days. It may sound small, but I feel a little lighter now.",
                time: "5 hours ago",
                supports: 18,
                comments: 4,
                sensitive: false
            },
            {
                id: 4,
                author: "Anonymous",
                anonymous: true,
                category: "Relationships",
                title: "Trying to move on from a difficult friendship",
                content:
                    "A close friendship ended recently, and I am still processing it. Some days are easier than others, but today has been difficult.",
                time: "Yesterday",
                supports: 10,
                comments: 2,
                sensitive: true
            }
        ];

        function getPosts() {
            const savedPosts = localStorage.getItem(storageKey);
            if (savedPosts === null) {
                localStorage.setItem(storageKey, JSON.stringify(samplePosts));
                return samplePosts;
            }
            try {
                return JSON.parse(savedPosts);
            } catch (error) {
                console.error("Could not load forum posts:", error);
                return samplePosts;
            }
        }

        function savePosts(posts) {
            localStorage.setItem(storageKey, JSON.stringify(posts));
        }

        function escapeHTML(text) {
            const element = document.createElement("div");
            element.textContent = String(text || "");
            return element.innerHTML;
        }

        function renderPosts() {
            const postList = document.getElementById("post-list");
            const posts = getPosts();

            if (posts.length === 0) {
                postList.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-8 text-center">
                        <h2 class="text-xl font-bold text-gray-700">No posts yet</h2>
                        <p class="text-gray-500 mt-2">Be the first person to share something.</p>
                        <a href="${isLoggedIn ? 'post.html' : 'login.html'}" class="inline-block mt-5 bg-indigo-600 text-white px-6 py-3 rounded-full">
                            Create a Post
                        </a>
                    </div>
                `;
                return;
            }

            postList.innerHTML = posts.map(post => {
                const displayName = post.anonymous ? "Anonymous" : "@" + escapeHTML(post.author);
                const avatarLetter = post.anonymous ? "A" : escapeHTML(post.author.charAt(0).toUpperCase());

                // Button styling based on login state
                const buttonClassState = isLoggedIn 
                    ? "bg-gray-100 hover:bg-indigo-100 text-gray-700 cursor-pointer" 
                    : "bg-gray-100 text-gray-400 cursor-not-allowed opacity-75";

                const reportButtonState = isLoggedIn 
                    ? "text-red-500 hover:bg-red-50 cursor-pointer" 
                    : "text-red-300 cursor-not-allowed opacity-75";

                return `
                    <article
                        class="post-card bg-white border border-gray-100 rounded-2xl shadow-md p-6"
                        data-post-id="${post.id}"
                    >
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white flex items-center justify-center font-bold">
                                    ${avatarLetter}
                                </div>
                                <div>
                                    <p class="font-semibold text-gray-800">${displayName}</p>
                                    <p class="text-xs text-gray-500">${escapeHTML(post.time)}</p>
                                </div>
                            </div>
                            <span class="bg-indigo-50 text-indigo-600 text-xs font-semibold px-3 py-1 rounded-full">
                                ${escapeHTML(post.category)}
                            </span>
                        </div>

                        <h2 class="text-xl font-bold text-gray-800 mt-5">
                            ${escapeHTML(post.title)}
                        </h2>

                        ${post.sensitive ? `
                            <div class="bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl p-3 mt-4">
                                Sensitive topic: Please take care while reading and responding.
                            </div>
                        ` : ""}

                        <p class="text-gray-600 leading-7 mt-3">
                            ${escapeHTML(post.content)}
                        </p>

                        <div class="border-t border-gray-100 mt-5 pt-4 flex items-center gap-3">
                            <button
                                type="button"
                                class="support-button ${buttonClassState} px-4 py-2 rounded-full font-medium transition"
                            >
                                ♡ Support (<span class="support-count">${post.supports || 0}</span>)
                            </button>

                            <button
                                type="button"
                                class="comment-button ${buttonClassState} px-4 py-2 rounded-full font-medium transition"
                            >
                                💬 Comments (${post.comments || 0})
                            </button>

                            <button
                                type="button"
                                class="report-button ml-auto ${reportButtonState} px-4 py-2 rounded-full font-medium transition"
                            >
                                Report
                            </button>
                        </div>
                    </article>
                `;
            }).join("");

            connectPostButtons();
        }

        function connectPostButtons() {
            const postCards = document.querySelectorAll(".post-card");

            postCards.forEach(postCard => {
                const postId = Number(postCard.dataset.postId);
                const supportButton = postCard.querySelector(".support-button");
                const supportCount = postCard.querySelector(".support-count");
                const commentButton = postCard.querySelector(".comment-button");
                const reportButton = postCard.querySelector(".report-button");

                supportButton.addEventListener("click", function () {
                    if (!isLoggedIn) {
                        alert("Please log in to support posts.");
                        window.location.href = "login.html";
                        return;
                    }

                    const posts = getPosts();
                    const selectedPost = posts.find(post => Number(post.id) === postId);
                    if (!selectedPost) return;

                    selectedPost.supports = Number(selectedPost.supports || 0) + 1;
                    supportCount.textContent = selectedPost.supports;
                    supportButton.classList.add("supported");
                    savePosts(posts);
                });

                commentButton.addEventListener("click", function () {
                    if (!isLoggedIn) {
                        alert("Please log in to view or write comments.");
                        window.location.href = "login.html";
                        return;
                    }
                    showCommentMessage();
                });

                reportButton.addEventListener("click", function () {
                    if (!isLoggedIn) {
                        alert("Please log in to report posts.");
                        window.location.href = "login.html";
                        return;
                    }
                    alert("The post has been reported for moderator review.");
                });
            });
        }

        function showCommentMessage() {
            alert("The comment feature will be added next.");
        }

        renderPosts();
    </script>

</body>
</html>
