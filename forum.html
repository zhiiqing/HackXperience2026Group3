<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum — HackXperience</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{ background:#f4f7fb; }
.message{ animation:fade .3s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white shadow-lg">
  <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
    <div class="flex items-center gap-4">
      <a href="index.html" class="bg-white/20 hover:bg-white/30 transition px-4 py-2 rounded-full">← Back</a>
      <a href="chat.html" class="bg-white/20 hover:bg-white/30 transition px-4 py-2 rounded-full">Chat</a>
      <div>
        <h1 class="text-2xl font-bold">Community Forum</h1>
        <p class="text-sm opacity-90">Share what's on your mind — anonymously, or not</p>
      </div>
    </div>
    <a href="create-post.html"
       class="bg-white text-indigo-600 font-semibold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition">
      + New Post
    </a>
  </div>
</header>

<main class="flex-1 overflow-y-auto p-6">
  <div id="post-list" class="max-w-3xl mx-auto space-y-5">
    <p class="text-gray-500 text-center">Loading posts...</p>
  </div>
</main>

<script src="forum.js"></script>
</body>
</html>
