name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build
        run: |
          # Find the folder containing package.json
          APP_DIR=$(find . -maxdepth 3 -name "package.json" -print -quit | xargs dirname)
          echo "Building from: $APP_DIR"
          cd "$APP_DIR"
          npm install
          npm run build --if-present

      - name: Zip Artifact
        run: |
          cd $(find . -maxdepth 3 -name "package.json" -print -quit | xargs dirname)
          zip -r release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HackXperience2026Group3' # Ensure this matches your Azure App Name exactly
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './**/release.zip'
