<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueSelf - Chatbot Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #dbeafe, #f5f3ff);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
        }

        /* Dropdown styling */
        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            
            <!-- Logo / Brand -->
            <div class="flex items-center gap-2">
                <span class="text-2xl">🤖</span>
                <span class="text-xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                    TrueSelf
                </span>
            </div>

            <!-- Navigation Links / Toggle Bar -->
            <nav class="flex flex-wrap items-center gap-2 md:gap-4 font-semibold text-sm">
                <a href="dashboard.html" class="px-4 py-2 rounded-full text-gray-600 hover:bg-gray-100 transition">Home</a>
                <a href="chat.html" class="px-4 py-2 rounded-full bg-blue-50 text-blue-600 transition">Chatbot</a>

                <!-- Virtual Plant Dropdown -->
                <div class="relative dropdown">
                    <button class="px-4 py-2 rounded-full text-gray-600 hover:bg-gray-100 transition flex items-center gap-1">
                        Virtual Plant ▾
                    </button>
                    <div class="dropdown-menu absolute hidden pt-2 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-50">
                        <a href="mood.html" class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 text-sm">Mood Calendar</a>
                        <a href="mediate.html" class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 text-sm">Meditation Clock</a>
                        <a href="exercise.html" class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600 text-sm">Exercising Clock</a>
                    </div>
                </div>

                <a href="forum.html" class="px-4 py-2 rounded-full text-gray-600 hover:bg-gray-100 transition">Forum</a>
                <a href="tier.html" class="px-4 py-2 rounded-full bg-rose-50 text-rose-600 hover:bg-rose-100 transition">Seek Help Now</a>
                <button id="logoutBtn" class="px-4 py-2 rounded-full text-red-500 hover:bg-red-50 transition">Logout</button>
            </nav>

        </div>
    </header>

    <!-- Main Content Chatbot -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10 flex flex-col">

        <div class="glass w-full rounded-3xl shadow-xl p-8 border border-white/80 flex flex-col flex-1 justify-between">
            
            <!-- Chat Header -->
            <div class="border-b border-gray-100 pb-4 mb-6 flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">TrueSelf AI Companion</h2>
                    <p class="text-gray-500 text-sm">Talk freely, reflect, and find support in a safe space.</p>
                </div>
                <span class="px-3 py-1 bg-emerald-50 text-emerald-600 font-semibold text-xs rounded-full border border-emerald-200">Online</span>
            </div>

            <!-- Chat Messages Container -->
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 mb-6 pr-2 max-h-[50vh]">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center text-white text-sm shadow">🤖</div>
                    <div class="bg-blue-50 text-gray-800 p-4 rounded-2xl rounded-tl-none text-sm max-w-md shadow-sm">
                        Hello! I'm your TrueSelf companion. How are you feeling today? Feel free to share whatever is on your mind.
                    </div>
                </div>
            </div>

            <!-- Chat Input Form -->
            <form id="chatForm" class="flex items-center gap-3 pt-4 border-t border-gray-100">
                <input 
                    type="text" 
                    id="chatInput" 
                    placeholder="Type your message here..." 
                    required
                    class="flex-1 border rounded-2xl px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-sm shadow-sm"
                >
                <button 
                    type="submit" 
                    class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-2xl font-semibold hover:scale-105 transition shadow-lg text-sm"
                >
                    Send
                </button>
            </form>

        </div>

    </main>

    <!-- Script to handle chat interaction (No login check required) -->
    <script>
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const messageText = chatInput.value.trim();
            if (!messageText) return;

            // Append user message
            const userBubble = document.createElement('div');
            userBubble.className = "flex items-start justify-end gap-3";
            userBubble.innerHTML = `
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-2xl rounded-tr-none text-sm max-w-md shadow-sm">
                    ${escapeHTML(messageText)}
                </div>
                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-700 text-sm shadow">👤</div>
            `;
            chatMessages.appendChild(userBubble);
            chatInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Simulate AI response after a short delay
            setTimeout(() => {
                const aiBubble = document.createElement('div');
                aiBubble.className = "flex items-start gap-3";
                aiBubble.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center text-white text-sm shadow">🤖</div>
                    <div class="bg-blue-50 text-gray-800 p-4 rounded-2xl rounded-tl-none text-sm max-w-md shadow-sm">
                        Thank you for sharing that with me. Remember to take things one step at a time, and don't forget to check out your wellness checklist or meditation clock today!
                    </div>
                `;
                chatMessages.appendChild(aiBubble);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
