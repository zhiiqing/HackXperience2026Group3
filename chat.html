<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff, #dbeafe, #f5f3ff);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #374151;
            position: relative;
            overflow: hidden;
        }

        /* Background Decorations */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .25;
            z-index: -1;
        }

        .circle1 {
            width: 300px;
            height: 300px;
            background: #93c5fd;
            top: 50px;
            left: 50px;
        }

        .circle2 {
            width: 360px;
            height: 360px;
            background: #c4b5fd;
            bottom: 50px;
            right: 50px;
        }

        /* Top Header */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(229, 231, 235, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #2563eb;
            border: 1px solid #2563eb;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #2563eb;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37,99,235,0.2);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1f2937;
            letter-spacing: 0.3px;
        }

        .header-right {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(37,99,235,0.25);
        }

        /* Chat Body Area */
        .chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(37,99,235,0.2);
        }

        .message-row.user .avatar {
            background: #4b5563;
            box-shadow: 0 2px 8px rgba(75,85,99,0.2);
        }

        .message-bubble {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            color: #1f2937;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            max-width: 650px;
            line-height: 1.6;
        }

        .message-row.user .message-bubble {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(37,99,235,0.2);
            white-space: pre-line;
        }

        .message-bubble p {
            margin-bottom: 8px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble ul {
            margin: 8px 0 8px 20px;
        }

        .message-bubble li {
            margin-bottom: 6px;
        }

        /* Bottom Input Area */
        .footer-input-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 24px;
            border-top: 1px solid rgba(229, 231, 235, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            color: #374151;
            background: white;
        }

        .message-input::placeholder {
            color: #9ca3af;
        }

        .message-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.2);
        }

        .send-btn {
            border: none;
            padding: 14px 30px;
            border-radius: 999px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.4);
        }

        /* Custom Modal Popup Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .modal-box h3 {
            color: #1f2937;
            margin-bottom: 12px;
            font-size: 1.3rem;
        }

        .modal-box p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-btn {
            border: none;
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.4);
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="index.html" class="back-btn">
                &larr; Back
            </a>
            <h1>AI Chatbot</h1>
        </div>
        <div class="header-right">
            🤖
        </div>
    </header>

    <!-- Chat Messages Container -->
    <div class="chat-container" id="chatContainer">
        <div class="message-row">
            <div class="avatar">AI</div>
            <div class="message-bubble">
                Hello! 👋 I'm your AI Chatbot. Feel free to chat with me about your mental wellness 😊
            </div>
        </div>
    </div>

    <!-- Bottom Input Section -->
    <div class="footer-input-container">
        <div class="input-wrapper">
            <input type="text" id="messageInput" class="message-input" placeholder="Type your message...">
        </div>
        <button id="sendBtn" class="send-btn">Send</button>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="popupModal">
        <div class="modal-box">
            <h3>We're Here For You</h3>
            <p>You don't have to go through this alone. Please click below to access immediate support resources.</p>
            <button class="modal-btn" id="modalRedirectBtn">Get Support</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const popupModal = document.getElementById('popupModal');
        const modalRedirectBtn = document.getElementById('modalRedirectBtn');

        const supportMessage = `I’m really sorry you’re feeling that way — that sounds really tough. I’m here for you. 

Try one of these:
• 5-4-3-2-1 grounding: name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.
• Slow breathing: inhale for 4, hold 4, exhale 4 (or try 4–6–8). Repeat 4 times.
• Move a little: stand, stretch, or step outside for a minute of fresh air.
• Write one sentence about what’s hardest right now — just getting it out can help.
• Reach out: text or call someone you trust and say, “I’m having a rough time — can we talk?”

If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988. 
You don’t have to handle this alone.`;

        const stressMessage = `I’m sorry — stress is really hard. I can help right now. 
If you want something fast, try one of these (pick one and I can guide you through it):
• Box/4-4-6 breathing (2 minutes)
Sit or stand comfortably.
Inhale slowly for 4 seconds. Hold for 4 seconds. Exhale for 6–8 seconds.
Repeat for 6–10 breaths.
• 5-4-3-2-1 grounding (1–2 minutes)
Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.
• Quick reset (3–5 minutes)
Stand, stretch, and walk for one minute.
Splash water on your face or get a glass of water.
Do a single progressive muscle tension-release: tense shoulders for 5s, then release.
If you want a short plan to reduce stress for the rest of today:
• Pick 1–3 must-do tasks and delay or delegate the rest.
• Use a 25-minute focused timer (Pomodoro), then take a 5–10 minute break.
• Do one soothing activity tonight (short walk, warm shower, 20 minutes reading).
• Sleep: try a wind-down routine (no screens 30–60 minutes before bed).
Longer-term ideas (if helpful): regular exercise, 10 minutes daily mindfulness or breathing, clearer boundaries (saying “I can’t do that right now”), talking with someone you trust, and professional help if stress is persistent. If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988. 
You don’t have to handle this alone.`;

        function handleSendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Append user message
            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `
                <div class="avatar">U</div>
                <div class="message-bubble">${escapeHtml(text)}</div>
            `;
            chatContainer.appendChild(userRow);

            messageInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const normalizedInput = text.toLowerCase().replace(/['‘’]/g, "'").trim();
            
            // Check for trigger phrase
            if (normalizedInput === 'i want to die') {
                popupModal.classList.add('active');
                return;
            }

            setTimeout(() => {
                const aiRow = document.createElement('div');
                aiRow.className = 'message-row';
                const aiBubble = document.createElement('div');
                aiBubble.className = 'message-bubble';
                
                if (normalizedInput === 'i am sad' || normalizedInput === 'i’m sad') {
                    aiBubble.innerHTML = `
                        <p>I’m really sorry you’re feeling that way — that sounds really tough. I’m here for you.</p>
                        <p>Try one of these:</p>
                        <ul>
                            <li><strong>5-4-3-2-1 grounding:</strong> name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.</li>
                            <li><strong>Slow breathing:</strong> inhale for 4, hold 4, exhale 4 (or try 4–6–8). Repeat 4 times.</li>
                            <li><strong>Move a little:</strong> stand, stretch, or step outside for a minute of fresh air.</li>
                            <li><strong>Write one sentence:</strong> about what’s hardest right now — just getting it out can help.</li>
                            <li><strong>Reach out:</strong> text or call someone you trust and say, “I’m having a rough time — can we talk?”</li>
                        </ul>
                        <p>If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988.</p>
                        <p>You don’t have to handle this alone.</p>
                    `;
                } else if (normalizedInput === 'i am stress' || normalizedInput === 'i am stressed' || normalizedInput === 'i’m stressed') {
                    aiBubble.innerHTML = `
                        <p>I’m sorry — stress is really hard. I can help right now.</p>
                        <p>If you want something fast, try one of these (pick one and I can guide you through it):</p>
                        <ul>
                            <li><strong>Box/4-4-6 breathing (2 minutes):</strong> Sit or stand comfortably. Inhale slowly for 4 seconds. Hold for 4 seconds. Exhale for 6–8 seconds. Repeat for 6–10 breaths.</li>
                            <li><strong>5-4-3-2-1 grounding (1–2 minutes):</strong> Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.</li>
                            <li><strong>Quick reset (3–5 minutes):</strong> Stand, stretch, and walk for one minute. Splash water on your face or get a glass of water. Do a single progressive muscle tension-release: tense shoulders for 5s, then release.</li>
                        </ul>
                        <p>If you want a short plan to reduce stress for the rest of today:</p>
                        <ul>
                            <li>Pick 1–3 must-do tasks and delay or delegate the rest.</li>
                            <li>Use a 25-minute focused timer (Pomodoro), then take a 5–10 minute break.</li>
                            <li>Do one soothing activity tonight (short walk, warm shower, 20 minutes reading).</li>
                            <li>Sleep: try a wind-down routine (no screens 30–60 minutes before bed).</li>
                        </ul>
                        <p>Longer-term ideas (if helpful): regular exercise, 10 minutes daily mindfulness or breathing, clearer boundaries (saying “I can’t do that right now”), talking with someone you trust, and professional help if stress is persistent.</p>
                        <p>If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988.</p>
                        <p>You don’t have to handle this alone.</p>
                    `;
                } else {
                    aiBubble.textContent = `I received your message: "${text}". How else can I help you today?`;
                }

                aiRow.innerHTML = `<div class="avatar">AI</div>`;
                aiRow.appendChild(aiBubble);
                chatContainer.appendChild(aiRow);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);
        }

        function escapeHtml(string) {
            return string.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        sendBtn.addEventListener('click', handleSendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        // Redirect logic when clicking the button inside the popup
        modalRedirectBtn.addEventListener('click', () => {
            window.location.href = 'tier.html';
        });
    </script>
</body>
</html>
