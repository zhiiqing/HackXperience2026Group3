<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .support-button.supported {
            background: #e0e7ff;
            color: #4338ca;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f4f7fb] text-gray-700 relative overflow-hidden">

    <!-- Background Decorations -->
    <div class="fixed rounded-full filter blur-[90px] opacity-25 -z-10 w-[300px] h-[300px] bg-[#93c5fd] top-[50px] left-[50px]"></div>
    <div class="fixed rounded-full filter blur-[90px] opacity-25 -z-10 w-[360px] h-[360px] bg-[#c4b5fd] bottom-[50px] right-[50px]"></div>

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white shadow-lg backdrop-blur-md flex-shrink-0">
        <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="bg-white/20 hover:bg-white/30 transition px-4 py-2 rounded-full text-white font-medium">
                    &larr; Back
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide">AI Chatbot</h1>
                    <p class="text-sm opacity-90">Your mental wellness companion</p>
                </div>
            </div>
            <div class="bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-inner">
                🤖
            </div>
        </div>
    </header>

    <!-- Chat Messages Container -->
    <main class="flex-1 overflow-y-auto p-6 min-h-0">
        <div class="max-w-3xl mx-auto flex flex-col gap-5" id="chatContainer">
            <div class="message-row flex items-start gap-3">
                <div class="w-11 h-11 rounded-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white flex items-center justify-center font-bold flex-shrink-0 shadow-md">
                    AI
                </div>
                <div class="message-bubble bg-white border border-gray-100 rounded-2xl shadow-md p-5 text-gray-800 max-w-xl leading-relaxed">
                    Hello! 👋 I'm your AI Chatbot. Feel free to chat with me about your mental wellness 😊
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Input Section -->
    <div class="bg-white/90 backdrop-blur-md p-4 border-t border-gray-200/50 shadow-lg flex-shrink-0">
        <div class="max-w-3xl mx-auto flex items-center gap-3">
            <div class="flex-1 relative">
                <input type="text" id="messageInput" class="w-full px-5 py-3 border border-gray-300 rounded-full text-sm outline-none transition focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 bg-white" placeholder="Type your message...">
            </div>
            <button id="sendBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition">
                Send
            </button>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 invisible transition-all duration-300" id="popupModal">
        <div class="modal-box bg-white p-8 rounded-2xl max-w-md w-[90%] shadow-2xl text-center border border-white/80">
            <h3 class="text-xl font-bold text-gray-800 mb-3">We're Here For You</h3>
            <p class="text-gray-600 text-sm leading-relaxed mb-6">You don't have to go through this alone. Please click below to access immediate support resources.</p>
            <button class="modal-btn bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition w-full" id="modalRedirectBtn">
                Get Support
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const popupModal = document.getElementById('popupModal');
        const modalRedirectBtn = document.getElementById('modalRedirectBtn');

        const supportMessage = `I’m really sorry you’re feeling that way — that sounds really tough. I’m here for you. 

Try one of these:
• 5-4-3-2-1 grounding: name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.
• Slow breathing: inhale for 4, hold 4, exhale 4 (or try 4–6–8). Repeat 4 times.
• Move a little: stand, stretch, or step outside for a minute of fresh air.
• Write one sentence about what’s hardest right now — just getting it out can help.
• Reach out: text or call someone you trust and say, “I’m having a rough time — can we talk?”

If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988. 
You don’t have to handle this alone.`;

        const stressMessage = `I’m sorry — stress is really hard. I can help right now. 
If you want something fast, try one of these (pick one and I can guide you through it):
• Box/4-4-6 breathing (2 minutes)
Sit or stand comfortably.
Inhale slowly for 4 seconds. Hold for 4 seconds. Exhale for 6–8 seconds.
Repeat for 6–10 breaths.
• 5-4-3-2-1 grounding (1–2 minutes)
Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.
• Quick reset (3–5 minutes)
Stand, stretch, and walk for one minute.
Splash water on your face or get a glass of water.
Do a single progressive muscle tension-release: tense shoulders for 5s, then release.
If you want a short plan to reduce stress for the rest of today:
• Pick 1–3 must-do tasks and delay or delegate the rest.
• Use a 25-minute focused timer (Pomodoro), then take a 5–10 minute break.
• Do one soothing activity tonight (short walk, warm shower, 20 minutes reading).
• Sleep: try a wind-down routine (no screens 30–60 minutes before bed).
Longer-term ideas (if helpful): regular exercise, 10 minutes daily mindfulness or breathing, clearer boundaries (saying “I can’t do that right now”), talking with someone you trust, and professional help if stress is persistent. If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988. 
You don’t have to handle this alone.`;

        function handleSendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Append user message
            const userRow = document.createElement('div');
            userRow.className = 'message-row flex items-start gap-3 flex-row-reverse';
            userRow.innerHTML = `
                <div class="w-11 h-11 rounded-full bg-gray-600 text-white flex items-center justify-center font-bold flex-shrink-0 shadow-md">
                    U
                </div>
                <div class="message-bubble bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl shadow-md p-5 max-w-xl leading-relaxed whitespace-pre-line">
                    ${escapeHtml(text)}
                </div>
            `;
            chatContainer.appendChild(userRow);

            messageInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const normalizedInput = text.toLowerCase().replace(/['‘’]/g, "'").trim();
            
            // Check for trigger phrase
            if (normalizedInput === 'i want to die') {
                popupModal.classList.remove('opacity-0', 'invisible');
                popupModal.classList.add('opacity-100', 'visible');
                return;
            }

            setTimeout(() => {
                const aiRow = document.createElement('div');
                aiRow.className = 'message-row flex items-start gap-3';
                const aiBubble = document.createElement('div');
                aiBubble.className = 'message-bubble bg-white border border-gray-100 rounded-2xl shadow-md p-5 text-gray-800 max-w-xl leading-relaxed';
                
                if (normalizedInput === 'i am sad' || normalizedInput === 'i’m sad') {
                    aiBubble.innerHTML = `
                        <p class="mb-2">I’m really sorry you’re feeling that way — that sounds really tough. I’m here for you.</p>
                        <p class="mb-2">Try one of these:</p>
                        <ul class="list-disc list-inside mb-2 space-y-1">
                            <li><strong>5-4-3-2-1 grounding:</strong> name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.</li>
                            <li><strong>Slow breathing:</strong> inhale for 4, hold 4, exhale 4 (or try 4–6–8). Repeat 4 times.</li>
                            <li><strong>Move a little:</strong> stand, stretch, or step outside for a minute of fresh air.</li>
                            <li><strong>Write one sentence:</strong> about what’s hardest right now — just getting it out can help.</li>
                            <li><strong>Reach out:</strong> text or call someone you trust and say, “I’m having a rough time — can we talk?”</li>
                        </ul>
                        <p class="mb-2">If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988.</p>
                        <p>You don’t have to handle this alone.</p>
                    `;
                } else if (normalizedInput === 'i am stress' || normalizedInput === 'i am stressed' || normalizedInput === 'i’m stressed') {
                    aiBubble.innerHTML = `
                        <p class="mb-2">I’m sorry — stress is really hard. I can help right now.</p>
                        <p class="mb-2">If you want something fast, try one of these (pick one and I can guide you through it):</p>
                        <ul class="list-disc list-inside mb-2 space-y-1">
                            <li><strong>Box/4-4-6 breathing (2 minutes):</strong> Sit or stand comfortably. Inhale slowly for 4 seconds. Hold for 4 seconds. Exhale for 6–8 seconds. Repeat for 6–10 breaths.</li>
                            <li><strong>5-4-3-2-1 grounding (1–2 minutes):</strong> Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, 1 you can taste.</li>
                            <li><strong>Quick reset (3–5 minutes):</strong> Stand, stretch, and walk for one minute. Splash water on your face or get a glass of water. Do a single progressive muscle tension-release: tense shoulders for 5s, then release.</li>
                        </ul>
                        <p class="mb-2">If you want a short plan to reduce stress for the rest of today:</p>
                        <ul class="list-disc list-inside mb-2 space-y-1">
                            <li>Pick 1–3 must-do tasks and delay or delegate the rest.</li>
                            <li>Use a 25-minute focused timer (Pomodoro), then take a 5–10 minute break.</li>
                            <li>Do one soothing activity tonight (short walk, warm shower, 20 minutes reading).</li>
                            <li>Sleep: try a wind-down routine (no screens 30–60 minutes before bed).</li>
                        </ul>
                        <p class="mb-2">Longer-term ideas (if helpful): regular exercise, 10 minutes daily mindfulness or breathing, clearer boundaries (saying “I can’t do that right now”), talking with someone you trust, and professional help if stress is persistent.</p>
                        <p class="mb-2">If you feel like you might harm yourself or are in immediate danger, please get help right away — call 911 or, if you’re in the U.S., the Suicide & Crisis Lifeline at 988.</p>
                        <p>You don’t have to handle this alone.</p>
                    `;
                } else {
                    aiBubble.textContent = `I received your message: "${text}". How else can I help you today?`;
                }

                aiRow.innerHTML = `
                    <div class="w-11 h-11 rounded-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white flex items-center justify-center font-bold flex-shrink-0 shadow-md">
                        AI
                    </div>
                `;
                aiRow.appendChild(aiBubble);
                chatContainer.appendChild(aiRow);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);
        }

        function escapeHtml(string) {
            return string.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        sendBtn.addEventListener('click', handleSendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        // Redirect logic when clicking the button inside the popup
        modalRedirectBtn.addEventListener('click', () => {
            window.location.href = 'tier.html';
        });
    </script>
</body>
</html>
