<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HackXperience | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eef2ff,
                    #ede9fe
                );
        }

        .glass {
            background:
                rgba(255, 255, 255, 0.8);

            backdrop-filter:
                blur(15px);
        }

        .floating {
            animation:
                float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-10px);
            }
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center px-4"
>

    <!-- Background decorations -->
    <div
        class="absolute top-10 left-10 w-72 h-72 bg-blue-300 opacity-20 rounded-full blur-3xl"
    ></div>

    <div
        class="absolute bottom-10 right-10 w-72 h-72 bg-purple-300 opacity-20 rounded-full blur-3xl"
    ></div>

    <!-- Login card -->
    <div
        class="glass relative w-full max-w-md rounded-3xl shadow-2xl p-8"
    >

        <!-- Icon -->
        <div class="floating flex justify-center mb-6">

            <div
                class="w-20 h-20 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center text-4xl shadow-lg"
            >
                ♡
            </div>

        </div>

        <h1
            class="text-3xl font-bold text-center text-gray-800"
        >
            Welcome Back
        </h1>

        <p
            class="text-center text-gray-500 mt-2 mb-8"
        >
            Sign in to continue to HackXperience
        </p>

        <form id="login-form">

            <!-- Email -->
            <div class="mb-5">

                <label
                    for="email"
                    class="block text-gray-700 mb-2"
                >
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                    class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>

            <!-- Password -->
            <div class="mb-2">

                <label
                    for="password"
                    class="block text-gray-700 mb-2"
                >
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>

            <!-- Remember me -->
            <div
                class="flex justify-between items-center text-sm mb-6 mt-3"
            >

                <label class="flex items-center">

                    <input
                        id="remember-me"
                        type="checkbox"
                        class="mr-2"
                    >

                    Remember Me

                </label>

                <button
                    type="button"
                    id="forgot-password"
                    class="text-blue-600 hover:underline"
                >
                    Forgot Password?
                </button>

            </div>

            <!-- Error message -->
            <p
                id="login-message"
                class="hidden text-red-600 text-sm mb-4"
            ></p>

            <!-- Login button -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:scale-105 transition duration-300 shadow-lg"
            >
                Login
            </button>

        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">

            <hr class="flex-grow border-gray-300">

            <span
                class="mx-4 text-gray-400 text-sm"
            >
                OR
            </span>

            <hr class="flex-grow border-gray-300">

        </div>

        <!-- Google login -->
        <button
            id="google-login"
            type="button"
            class="w-full border py-3 rounded-xl flex justify-center items-center gap-3 hover:bg-gray-100 transition"
        >

            <img
                src="https://www.svgrepo.com/show/475656/google-color.svg"
                class="w-6 h-6"
                alt="Google"
            >

            Continue with Google

        </button>

        <!-- Sign up -->
        <p class="text-center text-gray-600 mt-8">

            Don't have an account?

            <a
                href="signup.html"
                class="text-blue-600 font-semibold hover:underline"
            >
                Create Account
            </a>

        </p>

        <!-- Home -->
        <div class="text-center mt-5">

            <a
                href="index.html"
                class="text-gray-500 hover:text-blue-600"
            >
                ← Back to Home
            </a>

        </div>

    </div>

    <script>
        const loginForm =
            document.getElementById("login-form");

        const loginMessage =
            document.getElementById("login-message");

        loginForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const rememberMe =
                    document
                        .getElementById("remember-me")
                        .checked;

                if (
                    email === "" ||
                    password === ""
                ) {
                    loginMessage.textContent =
                        "Please enter your email and password.";

                    loginMessage.classList.remove(
                        "hidden"
                    );

                    return;
                }

                if (password.length < 6) {
                    loginMessage.textContent =
                        "Your password must contain at least 6 characters.";

                    loginMessage.classList.remove(
                        "hidden"
                    );

                    return;
                }

                loginMessage.classList.add(
                    "hidden"
                );

                /*
                    Prototype login only.
                    This is not secure real authentication.
                */
                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("userEmail", email);

                const nextPage = localStorage.getItem("redirectAfterLogin") || "index.html";
                localStorage.removeItem( 
                    "redirectAfterLogin"
                );

                window.lcoation.href = nextPage;
            }
            
        );

        document
            .getElementById("forgot-password")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Password recovery will be added later."
                    );
                }
            );

        document
            .getElementById("google-login")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Google login is not connected yet."
                    );
                }
            );
    </script>

</body>
</html>
