<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrueSelf | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eef2ff,
                    #ede9fe
                );
        }

        .glass {
            background:
                rgba(255, 255, 255, 0.8);

            backdrop-filter:
                blur(15px);
        }

        .floating {
            animation:
                float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-10px);
            }
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center px-4 relative"
>

    <!-- Top Left Fixed Back to Home Button with Icon -->
    <div class="fixed top-6 left-6 z-50">
        <a href="index.html" class="bg-white/80 hover:bg-white transition px-4 py-2 rounded-full text-blue-600 border border-blue-200 font-medium shadow-sm flex items-center gap-2">
            🏠 Back to Home
        </a>
    </div>

    <!-- Background decorations -->
    <div
        class="absolute top-10 left-10 w-72 h-72 bg-blue-300 opacity-20 rounded-full blur-3xl"
    ></div>

    <div
        class="absolute bottom-10 right-10 w-72 h-72 bg-purple-300 opacity-20 rounded-full blur-3xl"
    ></div>

    <!-- Login card -->
    <div
        class="glass relative w-full max-w-md rounded-3xl shadow-2xl p-8"
    >

        <!-- Icon -->
        <div class="floating flex justify-center mb-6">

            <div
                class="w-20 h-20 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center text-4xl shadow-lg"
            >
                🤖
            </div>

        </div>

        <h1
            class="text-3xl font-bold text-center text-gray-800"
        >
            Welcome Back
        </h1>

        <p
            class="text-center text-gray-500 mt-2 mb-6"
        >
            Sign in to continue to TrueSelf
        </p>

        <!-- Toggle Bar (Login / Sign Up) -->
        <div class="flex bg-gray-200 p-1 rounded-full mb-6">
            <a href="login.html" class="w-1/2 py-2 text-center text-sm font-semibold text-blue-600 bg-white rounded-full shadow transition">
                Login
            </a>
            <a href="signup.html" class="w-1/2 py-2 text-center text-sm font-semibold text-gray-600 rounded-full transition">
                Sign Up
            </a>
        </div>

        <form id="login-form">

            <!-- Email -->
            <div class="mb-5">

                <label
                    for="email"
                    class="block text-gray-700 mb-2"
                >
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    required
                    class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >

            </div>

            <!-- Password -->
            <div class="mb-2">

                <label
                    for="password"
                    class="block text-gray-700 mb-2"
                >
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >

            </div>

            <!-- Remember me -->
            <div
                class="flex justify-between items-center text-sm mb-6 mt-3"
            >

                <label class="flex items-center">

                    <input
                        id="remember-me"
                        type="checkbox"
                        class="mr-2"
                    >

                    Remember Me

                </label>

                <button
                    type="button"
                    id="forgot-password"
                    class="text-blue-600 hover:underline"
                >
                    Forgot Password?
                </button>

            </div>

            <!-- Error message -->
            <p
                id="login-message"
                class="hidden text-red-600 text-sm mb-4"
            ></p>

            <!-- Login button -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:scale-105 transition duration-300 shadow-lg"
            >
                Login
            </button>

        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">

            <hr class="flex-grow border-gray-300">

            <span
                class="mx-4 text-gray-400 text-sm"
            >
                OR
            </span>

            <hr class="flex-grow border-gray-300">

        </div>

        <!-- Google login -->
        <button
            id="google-login"
            type="button"
            class="w-full border py-3 rounded-xl flex justify-center items-center gap-3 hover:bg-gray-100 transition bg-white"
        >

            <img
                src="https://www.svgrepo.com/show/475656/google-color.svg"
                class="w-6 h-6"
                alt="Google"
            >

            Continue with Google

        </button>

        <!-- Sign up -->
        <p class="text-center text-gray-600 mt-8">

            Don't have an account?

            <a
                href="signup.html"
                class="text-blue-600 font-semibold hover:underline"
            >
                Create Account
            </a>

        </p>

    </div>

    <script>
        const loginForm =
            document.getElementById("login-form");

        const loginMessage =
            document.getElementById("login-message");

        loginForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById("password")
                        .value;

                if (
                    email === "" ||
                    password === ""
                ) {
                    loginMessage.textContent =
                        "Please enter your email and password.";

                    loginMessage.classList.remove(
                        "hidden"
                    );

                    return;
                }

                if (password.length < 6) {
                    loginMessage.textContent =
                        "Your password must contain at least 6 characters.";

                    loginMessage.classList.remove(
                        "hidden"
                    );

                    return;
                }

                // Check specific emails
                if (email === "new@gmail.com") {
                    loginMessage.textContent =
                        "No such account. Please sign up.";
                    loginMessage.classList.remove("hidden");
                    return;
                }

                if (email !== "test@gmail.com") {
                    loginMessage.textContent =
                        "No such account. Please sign up.";
                    loginMessage.classList.remove("hidden");
                    return;
                }

                loginMessage.classList.add(
                    "hidden"
                );

                /*
                    Grant login access and redirect to dashboard.html
                */
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("userEmail", email);

                window.location.href = "dashboard.html";
            }
        );

        document
            .getElementById("forgot-password")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Password recovery will be added later."
                    );
                }
            );

        document
            .getElementById("google-login")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Google login is not connected yet."
                    );
                }
            );
    </script>

</body>
</html>
