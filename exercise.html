<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueSelf - Exercise & Yoga Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #dbeafe, #f5f3ff);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="dashboard.html" class="px-4 py-2 rounded-full bg-blue-50 text-blue-600 font-medium transition flex items-center gap-2">
                &larr; Back to Dashboard
            </a>
            <div class="text-xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                Exercise & Stretch Session
            </div>
            <div class="w-24"></div> <!-- Spacer for alignment -->
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10 flex flex-col items-center justify-center">

        <div class="glass w-full rounded-3xl shadow-xl p-8 border border-white/80 text-center">
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Gentle Seated Yoga for Beginners</h1>
            <p class="text-gray-500 text-sm mb-8">Move at your own pace, stretch deeply, and release tension throughout your body.</p>

            <!-- Embedded YouTube Video Container -->
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-lg mb-8 bg-black">
                <iframe 
                    class="w-full h-full"
                    src="https://www.youtube.com/embed/nQwKKCqkJxg" 
                    title="Gentle Seated Yoga For Beginners & All Levels | 30 Minute Practice" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Session Details -->
            <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-2xl p-6 border border-blue-100 flex flex-col items-center">
                <span class="text-xs font-bold text-blue-600 uppercase tracking-widest mb-2">Full Body Stretch</span>
                <div class="text-2xl font-black text-gray-800 tracking-wider mb-1">30-Minute Practice</div>
                <p class="text-sm text-gray-500">Take your time, breathe deeply, and enjoy your physical wellness journey.</p>
            </div>

        </div>

    </main>

</body>
</html>
