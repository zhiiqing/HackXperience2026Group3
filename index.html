<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-lg">
        <h1 class="text-xl font-bold">HackXperience AI Assistant</h1>
    </header>

    <!-- Chat Window -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="bg-white p-3 rounded-lg shadow w-fit">
            Hello! I am your AI assistant. How can I help you today?
        </div>
    </main>

    <!-- Input Area -->
    <footer class="p-4 bg-white border-t">
        <div class="flex gap-2">
            <input id="user-input" type="text" class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Type your message...">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700">Send</button>
        </div>
    </footer>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const chatWindow = document.getElementById('chat-window');
            
            if (input.value.trim() !== "") {
                // Add User Message
                const userMsg = document.createElement('div');
                userMsg.className = "bg-blue-100 p-3 rounded-lg shadow w-fit ml-auto";
                userMsg.textContent = input.value;
                chatWindow.appendChild(userMsg);
                
                // Clear input
                input.value = "";
                
                // Scroll to bottom
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }
    </script>
</body>
