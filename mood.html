<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track how you're feeling day to day and see your patterns emerge." />
    <title>Mood Map | TrueSelf</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * { scroll-behavior: smooth; }
        body { font-family: "Inter", sans-serif; }

        .hero-background {
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 35%),
                radial-gradient(circle at top right, rgba(168, 85, 247, 0.15), transparent 35%),
                linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
        }

        .mood-button, .option-button {
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }
        .mood-button:hover, .option-button:hover { transform: translateY(-2px); }
        .mood-button.selected { border-color: #2563eb; background-color: #eff6ff; }
        .option-button.selected { border-width: 2px; }
    </style>
</head>
